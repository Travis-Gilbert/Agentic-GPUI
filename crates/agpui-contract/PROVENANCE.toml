moved_in = "SPEC-AGPUI-SEMANTIC-TREE-1.0 D1"
moved_from = "apps/theoremweb/crates/gpui/chat/src/kit/semantics.rs"
note = "Node, Rect, SemanticReadingItem, LiveRegion. Rect gained area/center/overlaps/contains because the dispatcher aims a real press at recorded geometry."

