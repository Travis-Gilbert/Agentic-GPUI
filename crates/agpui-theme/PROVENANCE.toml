# Provenance for `agpui-theme`.
#
# SPEC-AGPUI-HOME-1.0 H7 and A05. One row per module, so a reader can tell at a
# glance which code moved here from Theorem and which was written here, and can
# check the claim rather than take it.
#
# Nothing in this crate is a port. No third-party source was copied, adapted or
# translated into it, and it carries no attribution header for that reason. The
# `[oracle.linear]` block below records the one product whose behaviour the code
# names, under the ledger rule that a behaviour may be read and the code written
# from scratch.
#
# `theorem_sha256` is the digest of the file in the Theorem tree at the commit
# the move read. `local_sha256` is the digest of the file here at `moved_in`.
# Equal digests are the verbatim claim, checkable rather than asserted; where
# they differ the row says what changed, because a move that quietly edits is
# how the first pass at this deliverable shipped an older generation of the
# token schema without anyone being able to see it.

schema = "theorem-provenance/1"
package = "agpui-theme"
path = "crates/agpui-theme"

[source.theorem]
repository = "https://github.com/Travis-Gilbert/Theorem"
commit = "15d2154fe4a6e4cb9d086b3929acc0c9e6903a37"
branch = "agpui-home/base-1.0"
note = "The reconciled base: Codex's theoremweb-interaction-1.0 and gpui-kit-0.6-migration lanes merged with the graph-canvas work. Theorem's main carries an older generation of tokens.rs, color.rs and emit_gpui.rs and carries none of theme_law.rs, metrics.rs, bin/theme_check.rs or regions.rs, so main is not a tree this crate may be read from."

[oracle.linear]
kind = "behaviour"
product = "Linear"
note = "The generated theme law, the role names and the 36 shell metrics were derived from measurements of the running product. No Linear source was read, copied or translated; there is none to read. `ThemeInput::linear_reference` and `theme_law.rs::linear_reference_matches_live_painted_values` pin the measurement so a later drift in the derivation is a failing test rather than a changed screenshot."

