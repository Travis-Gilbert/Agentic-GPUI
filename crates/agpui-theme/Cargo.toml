[package]
name = "agpui-theme"
version = "0.1.0"
edition = "2021"
description = "Renderer-free design-token law, deterministic emitters, and shell metrics for AGPUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Travis-Gilbert/Agentic-GPUI"
rust-version = "1.85"

# Written out rather than inherited from the AGPUI workspace root, for the same
# reason `agpui-contract` is: a consumer that cannot afford a workspace root
# still has to be able to name this package by git rev.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The theme law reads and writes a theme document as TOML. Same major as
# Theorem's design-core pinned, so the two agree on the document's spelling.
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
