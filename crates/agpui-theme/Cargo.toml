[package]
name = "theorem-design-core"
version = "0.1.0"
edition = "2021"
description = "Renderer-free derived design tokens for Theorem product surfaces"
license = "MIT"
repository = "https://github.com/Travis-Gilbert/Theorem"
rust-version = "1.85"

[dependencies]
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
