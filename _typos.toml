[default]
extend-ignore-re = [
    '\\u\{[0-9A-Fa-f]+\}',
    # Ordered Git patch object IDs are immutable hex, not prose.
    '(?m)^index [0-9a-f]+\.\.[0-9a-f]+(?: [0-7]+)?$',
    # The exact screen-capture package identifier in the dependency patches.
    'zed-scap',
]

[default.extend-words]
# Correct Italian singular of "command".
comando = "comando"
# A deliberately misspelled manifest key: `crates/shell/src/plugin.rs` refuses
# it by name, and the test that proves it has to contain the misspelling.
capabilites = "capabilites"
# Misspellings that only exist inside assertions proving a name is refused.
backgrund = "backgrund"
wtach = "wtach"
netwrok = "netwrok"
workspce = "workspce"

[files]
extend-exclude = ["crates/story/src/fixtures/"]
